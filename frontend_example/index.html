<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="知识依赖图谱学习网页原型">
  <title>Transformer 可视化学习地图 · 知识图谱原型</title>
  <script>
    (() => {
      try {
        const key = "transformer-tutorial-theme";
        const savedTheme = window.localStorage.getItem(key);
        const theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260801-gif-stable">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <a class="brand" href="#" aria-label="返回页面顶部">
        <span class="brand__mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>LEARNING MAP</span>
      </a>
      <div class="hero__eyebrow"><span></span> 交互式学习路径</div>
      <h1>Transformer 可视化学习地图</h1>
      <p>从基础数学到注意力机制，一步步理解 Transformer 的结构</p>
      <div class="hero__meta">
        <span><strong id="topicCount">-</strong> 个知识点</span>
        <span aria-hidden="true">·</span>
        <span><strong id="edgeCount">—</strong> 条依赖关系</span>
      </div>
      <button class="hero-start-button" id="startMap" type="button">
        <span class="hero-start-button__icon" aria-hidden="true"></span>
        <span>开始学习</span>
      </button>
    </header>

    <main class="learning-workspace">
      <section class="map-section" aria-label="知识图谱">
        <div class="graph-card" id="graphCard">
          <div class="graph-toolbar">
            <div class="graph-toolbar__left">
              <span class="live-dot" aria-hidden="true"></span>
              <span id="viewLabel">完整知识图谱</span>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <span class="toolbar-hint">移动到圆点上查看知识点，点击圆点探索它与其他知识的关系。</span>
            </div>
            <button class="graph-return graph-continue" id="continueLearning" type="button" hidden>继续学习</button>
            <button class="graph-return" id="returnGraph" type="button" hidden>返回整体图谱</button>
          </div>

          <div class="layer-headings" aria-hidden="true"></div>

          <div class="graph-viewport" id="graphViewport">
            <div class="layer-bands" aria-hidden="true"></div>
            <svg id="knowledgeGraph" viewBox="0 0 720 520" role="img" aria-labelledby="graphTitle graphDesc">
              <!-- <title id="graphTitle">课程知识依赖图谱</title> -->
              <desc id="graphDesc">圆形表示知识点，连线表示学习依赖。可选择任意知识点查看前置、当前与后续节点。</desc>
              <defs>
                <marker id="arrowDefault" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrowDefaultHover" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrowBefore" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrowAfter" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
                <marker id="arrowPeer" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z"></path>
                </marker>
              </defs>
              <g id="viewportGroup">
                <g id="edgesLayer"></g>
                <g id="edgeLabelsLayer"></g>
                <g id="nodesLayer"></g>
              </g>
            </svg>
            <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

            <aside class="node-inspector graph-inspector" id="nodeInspector" aria-live="polite" hidden>
              <div class="node-inspector__number" id="inspectorNumber">01</div>
              <div class="node-inspector__content">
                <div class="node-inspector__tag" id="inspectorTag">基础数学</div>
                <h3 id="inspectorName">知识点名称</h3>
                <p id="inspectorBrief">这里显示该知识点的简要介绍。</p>
                <div class="node-inspector__relations">
                  <span><i class="relation-dot relation-dot--before"></i><b id="beforeCount">0</b> 个前置</span>
                  <span><i class="relation-dot relation-dot--after"></i><b id="afterCount">0</b> 个后续</span>
                </div>
              </div>
              <button class="primary-button primary-button--compact" id="learnHere" type="button">
                从此处开始学习 <span aria-hidden="true">→</span>
              </button>
            </aside>
          </div>

          <div class="graph-footer">
            <div class="legend" aria-label="知识点状态图例">
              <span class="legend__title">学习状态</span>
              <span><i class="status-dot status-dot--mastered"></i>已掌握</span>
              <span><i class="status-dot status-dot--learning"></i>正在学习</span>
              <span><i class="status-dot status-dot--ready"></i>未学习</span>
              <span><i class="status-dot status-dot--locked"></i>缺少前置知识</span>
            </div>
            <div class="graph-debug-actions">
              <button class="graph-debug-button" id="toggleEdgeLabels" type="button" aria-pressed="false">显示线条标签</button>
              <button class="graph-debug-button" id="toggleEdgeArrows" type="button" aria-pressed="false">显示线条箭头</button>
              <button class="graph-debug-button" id="toggleNodeNames" type="button" aria-pressed="true">显示节点名称</button>
              <button class="graph-debug-button" id="resetLearningState" type="button">重置学习状态</button>
              <button class="graph-debug-button" id="printNodePositions" type="button" hidden>打印节点位置</button>
            </div>
          </div>
        </div>
      </section>

      <section class="lesson-section is-empty" id="lessonSection" aria-labelledby="lessonTitle">
        <div class="lesson-placeholder" id="lessonPlaceholder">
          <div class="lesson-placeholder__graphic" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <p class="section-kicker">知识点文档</p>
          <h2 id="lessonTitle">选择一个起点，开始今天的学习</h2>
          <p>开始学习后，这里会显示知识讲解。</p>
        </div>

        <article class="lesson-document" id="lessonDocument" hidden>
          <nav class="lesson-breadcrumb" aria-label="知识点路径">
            <span id="lessonLayer">—</span><span>›</span><strong id="lessonBreadcrumb">—</strong>
          </nav>
          <div class="lesson-layout">
            <aside class="lesson-progress">
              <div class="progress-ring" id="progressRing" style="--progress: 16">
                <span id="lessonProgressValue">16%</span>
              </div>
              <strong>当前进度</strong>
              <span id="lessonPosition">第 - / - 节</span>
            </aside>
            <div class="lesson-main">
              <div class="markdown-body" id="lessonMarkdown"></div>

              <div class="lesson-actions">
                <button class="primary-button" id="completeLesson" type="button">
                  标记为已掌握 <span aria-hidden="true">✓</span>
                </button>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>
<!-- 
    <footer class="site-footer">
      <span>Transformer 可视化学习地图</span>
      <span aria-hidden="true">·</span>
      <span>本地知识图谱学习页</span>
    </footer> -->

    <div class="floating-actions" aria-label="快速操作">
      <button class="map-locator floating-action" id="backToMap" type="button" aria-label="定位到知识图谱">
        <span class="map-locator__target" aria-hidden="true"></span>
        <span>图谱</span>
      </button>
      <button class="theme-toggle floating-action" id="themeToggle" type="button" aria-label="切换暗色模式" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
        <span class="theme-toggle__text">暗色</span>
      </button>
    </div>

  </div>

  <script src="marked.min.js" defer></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        enableMenu: false,
        enableEnrichment: false,
        enableSpeech: false,
        enableBraille: false,
        enableExplorer: false,
        enableExplorerHelp: false,
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        renderActions: {
          attachSpeech: [0]
        },
        a11y: {
          speech: false,
          braille: false
        }
      },
      startup: {
        typeset: false,
        ready: () => {
          MathJax.startup.defaultReady();
          const document = MathJax.startup.document;
          document?.removeRenderAction?.("attachSpeech");
          if (document?.options) {
            document.options.enableSpeech = false;
            document.options.enableBraille = false;
            document.options.enableExplorer = false;
            document.options.enableEnrichment = false;
          }
        }
      }
    };
  </script>
  <script src="tex-mml-chtml.js" defer></script>
  <script src="app.js?v=20260801-gif-stable" defer></script>
</body>
</html>
